services:
  web:
    build:
      context: ./web
      target: development
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/workspace:ro
      - ./web:/app
      - web-node-modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent:
    build:
      context: ./agent
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      WHATS_A_CV_REPOSITORY: /workspace
    volumes:
      - .:/workspace
      - whats-a-cv-state:/workspace/.whats-a-cv
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  web-node-modules:
  whats-a-cv-state:
